name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish Docker images to the configured registry
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.0
  DEFAULT_IMAGE_REGISTRY: ghcr.io

jobs:
  rust:
    name: Test and build crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache Cargo output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/index/
            target/
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Tests run in the release profile so they share `target/release` with
      # the build step below. Compiling the workspace once in one profile is
      # much cheaper than a dev compile for tests plus a release compile for
      # the shipped binaries.
      - name: Run tests
        run: cargo test --workspace --locked --release

      - name: Build workspace
        run: cargo build --workspace --locked --release

      # Hand the release binaries to the image job so no Rust is compiled
      # inside Docker; the Dockerfiles consume this via `dist=./dist`.
      - name: Stage release binaries
        run: |
          install -Dm755 target/release/papermake-server dist/papermake-server
          install -Dm755 target/release/papermake-worker dist/papermake-worker

      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image names
        run: |
          registry="${IMAGE_REGISTRY:-$DEFAULT_IMAGE_REGISTRY}"
          namespace="${IMAGE_NAMESPACE:-$GITHUB_REPOSITORY}"
          registry="${registry,,}"
          namespace="${namespace,,}"

          server_image="$registry/$namespace/papermake-server"
          worker_image="$registry/$namespace/papermake-worker"
          safe_ref="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:@' '---' | tr -c 'A-Za-z0-9_.-' '-')"

          {
            echo "IMAGE_REGISTRY=$registry"
            echo "IMAGE_NAMESPACE=$namespace"
            echo "SERVER_IMAGE=$server_image"
            echo "WORKER_IMAGE=$worker_image"
            echo "SERVER_TAGS<<EOF"
            echo "$server_image:$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/$GITHUB_DEFAULT_BRANCH" ]; then
              echo "$server_image:latest"
            fi
            if [ -n "$safe_ref" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$server_image:$safe_ref"
            fi
            echo "EOF"
            echo "WORKER_TAGS<<EOF"
            echo "$worker_image:$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/$GITHUB_DEFAULT_BRANCH" ]; then
              echo "$worker_image:latest"
            fi
            if [ -n "$safe_ref" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$worker_image:$safe_ref"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

      # The release binaries the rust job already compiled. Passing them as the
      # `dist` build context overrides that stage in both Dockerfiles, so the
      # in-image `cargo build` never runs.
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Restore binary permissions
        run: chmod +x dist/papermake-server dist/papermake-worker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/papermake-server/Dockerfile
          build-contexts: dist=./dist
          push: false
          tags: ${{ env.SERVER_TAGS }}
          cache-from: type=gha,scope=papermake-server
          cache-to: type=gha,mode=max,scope=papermake-server

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/papermake-worker/Dockerfile
          build-contexts: dist=./dist
          push: false
          tags: ${{ env.WORKER_TAGS }}
          cache-from: type=gha,scope=papermake-worker
          cache-to: type=gha,mode=max,scope=papermake-worker

      - name: Login to registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Publish server image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/papermake-server/Dockerfile
          build-contexts: dist=./dist
          push: true
          tags: ${{ env.SERVER_TAGS }}
          cache-from: type=gha,scope=papermake-server
          cache-to: type=gha,mode=max,scope=papermake-server

      - name: Publish worker image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/papermake-worker/Dockerfile
          build-contexts: dist=./dist
          push: true
          tags: ${{ env.WORKER_TAGS }}
          cache-from: type=gha,scope=papermake-worker
          cache-to: type=gha,mode=max,scope=papermake-worker
